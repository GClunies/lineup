name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The worktree tests run the real wt. Without it they skip.
      - name: Install worktrunk
        env:
          WT_VERSION: v0.81.0
          WT_SHA256: 0c253f216985ce9cd7b202a11606b5ce6aa934b1019fd1fbb9b7ce2b47b1c74a
        run: |
          name=worktrunk-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/wt.tar.xz" "https://github.com/max-sixty/worktrunk/releases/download/$WT_VERSION/$name.tar.xz"
          echo "$WT_SHA256  $RUNNER_TEMP/wt.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/wt.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: Set a git identity for the tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@users.noreply.github.com
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
