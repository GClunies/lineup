wip_cap = 5
poll_interval = "30s"
start_skills = ["pstack:poteto-mode"]
local_tracker = false

[budgets]
ci_debug = 3
responding = 3

[stage.default]
model = "claude-opus-5-5"
effort = "high"
skill = "pstack:poteto-mode"

[[repos]]
match = "~/repos/*/*"

[[repos]]
match = "~/repos/crexi/*"
[repos.review_bot]
name = "greptile"
min_review_score = 5
max_review_cycles = 5

[[repos]]
match = "~/repos/crexi/data"
teams = ["PD"]

# Personal repos (GClunies/*) track Issues in GitHub. lineup keeps one
# lifecycle label on each Issue.
[github.labels]
started = "in progress"
in_review = "in review"

[linear.crexi]
client_id = "38f3c5578b51fe18af49539416af591c" # Crexi only allows apps registered in Crexi

[linear.crexi.status.PD]
started = "In Development"

# At most 5 queue reviews run at once. Queues fill in config order, so
# PD teammates picks first and owns any PR that crexi/data also matches.
[review]
slots = 5

[[review.queues]]
name = "PD teammates"
repo = ["crexi/data"]
author = ["wsauret", "amahdavi-crexi", "mmadison-crexi"]

[[review.queues]]
name = "crexi/data"
repo = ["crexi/data"]
exclude_regex = "HLESS-"

# Board sections: order, which start closed, and which are hidden.
# d on the board shows or hides Done.
[board]
order = ["done", "needs_you", "working", "waiting", "queued", "ready", "backlog"]
collapsed = ["backlog"]
hidden = ["done"]

# Personal: hod tracks its Issues in the Local Tracker only.
[[repos]]
match = "~/repos/gclunies/hod"
trackers = ["local"]
prefix = "hod"
